version = "hisn-profile/v1"

# Docker T2: raw socket forward, root-equivalent.
# The daemon socket is a mount, so network = "none" is enough to reach it.
# (network = "host" would additionally need Landlock ABI >= 6.)
[policy]
version = "hisn-policy/v1"
session.cwd = "."
session.network = "none"
mounts.grantable_rw = ["/srv/out"]

[[forward]]
name = "docker"
socket = "/var/run/docker.sock"
expose = "/run/docker.sock"
risk = "root-equivalent"
risk_ack = "root-equivalent"

[docker]
tier = "socket"
risk_ack = "root-equivalent"